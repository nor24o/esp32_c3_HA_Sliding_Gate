<!DOCTYPE html>
<html>
<head>
    <title>Config</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body{font-family:sans-serif;margin:20px;background-color:#f4f4f4}
        .card{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);max-width:400px;margin:auto}
        input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
        input[type=submit]{background-color:#007bff;color:white;cursor:pointer;padding:12px;border:none;border-radius:4px;width:100%}
    </style>
</head>
<body>
    <div class='card'>
        <h2>Configuration</h2>
        <form action='/save' method='POST'>
            <label>MQTT IP:</label><input type='text' name='mq_ip' value='%MQ_IP%'>
            <label>MQTT Port:</label><input type='text' name='mq_pt' value='%MQ_PT%'>
            <label>MQTT User:</label><input type='text' name='mq_us' value='%MQ_US%'>
            <label>MQTT Pass:</label><input type='password' name='mq_pw' value='%MQ_PW%'>

            <hr>
            <h3 style='margin-bottom:5px'>Timing Settings</h3>
            <label>Travel Time (ms):</label><input type='number' name='tt' value='%TT%'>
            <label>Motor Delay (ms):</label><input type='number' name='mdd' value='%MDD%'>
            <label>RF Debounce (ms):</label><input type='number' name='rfd' value='%RFD%'>
            <label>Auto-Close Delay (ms):</label><input type='number' name='acd' value='%ACD%'>

            <div style='text-align:left;margin:10px 0;padding:10px;background:#eee;border-radius:4px'>
                <label><input type='checkbox' name='ac_bar' %CHK_AC%> Auto-Close after Barrier</label><br>
                <label><input type='checkbox' name='bh' %CHK_BH%> Barrier Active HIGH</label><br>
                <label><input type='checkbox' name='lh' %CHK_LH%> Limits Active HIGH</label>
            </div>

            <input type='submit' value='SAVE & REBOOT'>
        </form>
        <br><center><a href='/'>Back to Controls</a></center>
    </div>
</body>
</html>
