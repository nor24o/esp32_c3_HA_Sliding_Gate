<!DOCTYPE html>
<html>
<head>
    <title>Gate Control</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body{font-family:sans-serif;margin:10px;text-align:center;background:#f4f4f4}
        .card{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);max-width:500px;margin:10px auto}
        .btn{display:inline-block;padding:12px;color:white;text-decoration:none;border-radius:5px;margin:5px;font-weight:bold;cursor:pointer;border:none;font-size:16px;width:30%}
        .grn{background:#28a745}.red{background:#dc3545}.gry{background:#6c757d}.blu{background:#007bff}
        .sensor-row{display:flex;justify-content:space-between;padding:8px;background:#eee;border-bottom:1px solid #ddd}
        table{width:100%;border-collapse:collapse;margin-top:10px} 
        th,td{border:1px solid #ddd;padding:8px}
        textarea{width:100%;height:100px;font-family:monospace;font-size:12px;margin-bottom:10px}
    </style>
</head>
<body>
    <div class='card'>
        <h1>Gate Control</h1>
        <p>Status: <b id='status'>...</b> <span id='sub_status' style='color:#007bff'></span></p>
        <p>Position: <b id='pos'>...</b>%</p>
        <p style="font-size: 0.9em; color: #666;">Pedestrian Setting: <b id='ped_val'>-</b>%</p>
        
        <button onclick="send('OPEN')" class='btn grn'>OPEN</button>
        <button onclick="send('STOP')" class='btn gry'>STOP</button>
        <button onclick="send('CLOSE')" class='btn red'>CLOSE</button>
    </div>

    <div class='card'>
        <h3>Sensors</h3>
        <div class='sensor-row'><span>Open Limit:</span><span id='lo_ind'>-</span></div>
        <div class='sensor-row'><span>Close Limit:</span><span id='lc_ind'>-</span></div>
        <div class='sensor-row'><span>Barrier:</span><span id='pb_ind'>-</span></div>
        <div class='sensor-row'><span>Last RF:</span><b id='rf_val'>-</b></div>
    </div>

    <div class='card'>
        <h3>RF Remotes</h3>
        <button id='scanBtn' onclick="toggleScan()" class='btn blu' style='width:90%'>Scan New Remote</button>
        <div id='scanPanel' style='display:none;background:#e9ecef;padding:10px;margin-top:10px'>
            <p>Press remote button...</p>
            <b>Code: <span id='scannedCode'>Waiting...</span></b><br><br>
            <select id='funcSel'>
                <option value='0'>OPEN</option>
                <option value='1'>CLOSE</option>
                <option value='2'>STOP</option>
                <option value='3'>PEDESTRIAN</option>
                <option value='4'>TOGGLE</option>
            </select>
            <button onclick="addCode()" class='btn grn'>ADD</button>
        </div>
        <table id='rfTable'>
            <thead><tr><th>Code</th><th>Func</th><th>Action</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class='card'>
        <h3>System</h3>
        <button onclick="send('CALIBRATE')" class='btn blu' style='width:45%'>Calibrate</button>
        <button onclick="send('CALIBRATE_CANCEL')" class='btn red' style='width:45%'>Cancel</button>
        <br><br>
        <a href='/config'><button class='btn gry' style='width:45%'>WiFi/MQTT</button></a>
        <br><br>
        <textarea id='logArea' readonly>Loading...</textarea>
        <button onclick='fetchLogs()' class='btn gry'>Refresh</button>
        <button onclick='clearLogs()' class='btn red'>Clear</button>
    </div>

    <script>
        var ws = new WebSocket('ws://' + location.hostname + ':81/');
        var scanning = false; 
        var lastScanned = 0;

        ws.onmessage = function(e) {
            var d = JSON.parse(e.data);
            if(d.type === 'status') {
                document.getElementById('status').innerHTML = d.s;
                document.getElementById('sub_status').innerHTML = d.ss;
                document.getElementById('pos').innerHTML = d.p;
                // UPDATE NEW ELEMENT
                document.getElementById('ped_val').innerHTML = d.pw; 
                
                document.getElementById('lo_ind').innerHTML = d.lo==0?'<b style="color:red">HIT</b>':'<span style="color:green">FREE</span>';
                document.getElementById('lc_ind').innerHTML = d.lc==0?'<b style="color:red">HIT</b>':'<span style="color:green">FREE</span>';
                document.getElementById('pb_ind').innerHTML = d.pb==0?'<b style="color:red">BLOCKED</b>':'<span style="color:green">CLEAR</span>';
                document.getElementById('rf_val').innerHTML = d.rf;
                
                if(scanning && d.s === 'SCANNING' && d.ss !== 'Waiting...') {
                    lastScanned = d.ss; 
                    document.getElementById('scannedCode').innerHTML = lastScanned;
                }
            } else if (d.type === 'rf_list') { 
                renderTable(d.data); 
            }
        };

        function renderTable(list) {
            var tb = document.querySelector('#rfTable tbody'); 
            tb.innerHTML = '';
            var funcs = ['OPEN', 'CLOSE', 'STOP', 'PED', 'TOGGLE'];
            list.forEach((item, idx) => {
                tb.innerHTML += '<tr><td>'+item.c+'</td><td>'+funcs[item.f]+'</td><td><button onclick="delCode('+idx+')" style="background:red;color:white;border:none;border-radius:3px">X</button></td></tr>';
            });
        }

        function send(cmd) { ws.send(cmd); }
        
        function toggleScan() { 
            scanning = !scanning;
            document.getElementById('scanPanel').style.display = scanning ? 'block' : 'none';
            document.getElementById('scanBtn').innerText = scanning ? 'Stop Scanning' : 'Scan New Remote';
            ws.send(scanning ? 'SCAN_START' : 'SCAN_STOP'); 
        }

        function addCode() { 
            if(lastScanned != 0) { 
                var f = document.getElementById('funcSel').value; 
                ws.send('ADD:' + lastScanned + ':' + f); 
                toggleScan(); 
            } 
        }

        function delCode(idx) { if(confirm('Delete?')) ws.send('DEL:' + idx); }
        function fetchLogs() { fetch('/logs').then(r => r.text()).then(t => document.getElementById('logArea').value = t); }
        function clearLogs() { fetch('/clear_logs').then(r => fetchLogs()); }
        
        fetchLogs();
    </script>
</body>
</html>
