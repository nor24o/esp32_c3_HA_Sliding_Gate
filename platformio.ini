; ============================================================
;  Gate Controller – PlatformIO Project Configuration
;  Board  : ESP32-C3-DevKitC-02  (4 MB flash)
;  Stack  : pioarduino (latest stable), Arduino framework
;
;  Partition scheme: custom (no OTA)
;    App     0x10000  1.62 MB  → fits the ~1.32 MB binary + growth room
;    LitteFS 0x1B0000  320 KB  → web UI files & system log
; ============================================================

[platformio]
default_envs = esp32-c3

; ─── Shared build options ───────────────────────────────────
[common]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MQTT_MAX_PACKET_SIZE=2048
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    -Wall
    -Wno-address
    -Wno-error=format

lib_deps_common =
    https://github.com/sui77/rc-switch.git#master
    lennarthennigs/Button2             @ 2.3.3
    bblanchon/ArduinoJson              @ 7.4.2
    dawidchyrzynski/home-assistant-integration @ 2.1.0
    ESP32Async/ESPAsyncWebServer       @ 3.7.0
    ESP32Async/AsyncTCP                @ 3.3.2
    tzapu/WiFiManager                  @ 2.0.17

; ─── Primary target : ESP32-C3-DevKitC-02 ──────────────────
[env:esp32-c3]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = esp32-c3-devkitc-02
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200

; ── Flash & partition layout ────────────────────────────────
board_upload.flash_size    = 4MB
board_build.flash_mode     = dio
board_build.partitions     = partitions.csv   ; custom table in project root
board_build.filesystem     = littlefs

build_flags = ${common.build_flags}
lib_deps    = ${common.lib_deps_common}
lib_ignore  = RPAsyncTCP
              ESPAsyncTCP

; ─── Secondary target : ESP32-S3-Zero ───────────────────────
[env:esp32-s3]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board         = waveshare_esp32_s3_zero
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200
board_upload.flash_size    = 4MB
board_build.flash_mode     = dio
board_build.partitions     = partitions.csv
board_build.filesystem     = littlefs
build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps    = ${common.lib_deps_common}